name: Build fork sqlfluffrs wheels

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Branch/ref to build
        required: true
        default: personal/databricks-complete
        type: string

permissions:
  contents: read

jobs:
  generate-rust-dialects:
    name: Generate Rust dialects
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Generate Rust dialects
        run: |
          python -m pip install -e .
          python utils/rustify.py build

      - name: Upload generated Rust dialects
        uses: actions/upload-artifact@v7
        with:
          name: generated-rust-dialects
          path: sqlfluffrs/sqlfluffrs_dialects/src/
          retention-days: 1

  build-wheels:
    name: Build wheels (${{ matrix.artifact }})
    needs: [generate-rust-dialects]
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {runner: ubuntu-22.04, target: x86_64, manylinux: auto, artifact: linux-x86_64, minpy: true}
          - {runner: windows-latest, target: x64, manylinux: "", artifact: windows-x64, arch: x64, minpy: false}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 1

      - name: Download generated Rust dialects
        uses: actions/download-artifact@v8
        with:
          name: generated-rust-dialects
          path: sqlfluffrs/sqlfluffrs_dialects/src/

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          architecture: ${{ matrix.arch || null }}

      - name: Build wheels (linux)
        if: matrix.minpy
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          args: --release -i python3.10 --out dist --manifest-path sqlfluffrs/Cargo.toml
          manylinux: ${{ matrix.manylinux || '' }}

      - name: Build wheels (windows)
        if: ${{ !matrix.minpy }}
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          args: --release --out dist --manifest-path sqlfluffrs/Cargo.toml
          manylinux: ${{ matrix.manylinux || '' }}

      - name: Upload wheels
        uses: actions/upload-artifact@v7
        with:
          name: wheels-${{ matrix.artifact }}
          path: dist

  release:
    name: Release
    runs-on: ubuntu-latest
    needs: [build-wheels]
    permissions:
      contents: write
    steps:
      - name: Download all wheels
        uses: actions/download-artifact@v8
        with:
          path: dist

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: dbx-rs-${{ github.run_number }}
          name: sqlfluffrs fork build ${{ github.run_number }}
          files: dist/wheels-*/*
          fail_on_unmatched_files: true
